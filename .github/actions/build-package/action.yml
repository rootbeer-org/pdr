name: Build packages with rb
description: Build a group of one level's packages after importing this run's earlier levels, then upload their runtime closures.
inputs:
  platform:
    description: The rb platform, such as x86_64-linux
    required: true
  packages:
    description: Space-separated packages as name@version, none depending on another
    required: true
runs:
  using: composite
  steps:
    - uses: rootbeer-org/setup-rb@bf50460fdf9e1b17508117150b26b624b840d08c
    - name: Prepare the store
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        if [[ $RUNNER_OS == Linux ]]; then
          docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<< "$GH_TOKEN"
          # bubblewrap in the builder is unprivileged as far as the host knows
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          echo "RB=$GITHUB_WORKSPACE/.github/builder/rb" >> "$GITHUB_ENV"
        else
          # The toolchain host.lua names for aarch64-macos, which every macOS key includes
          sudo xcode-select --switch /Applications/Xcode_16.4.app
          sudo "$(command -v rb-helper)" setup admin
          echo 'RB=rb' >> "$GITHUB_ENV"
        fi
    - name: Download earlier levels from this run
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        pattern: build-${{ inputs.platform }}-*
        path: imports
        merge-multiple: true
    - name: Import, build, check, and export
      id: build
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
        RB_REGISTRY_USER: ${{ github.actor }}
        RB_REGISTRY_TOKEN: ${{ github.token }}
      run: |
        if [[ -d imports ]]; then
          "$RB" drv import imports
        fi

        # Nothing in a group depends on the rest of it, so a failure doesn't stop the others
        failed=()
        for package in $PACKAGES; do
          echo "::group::$package"
          if ! "$RB" drv build "$package" --verbose --require-dependencies --registry "$REGISTRY" --from "$STORE" \
            || ! "$RB" drv export "$package" out; then
            echo "::error::$package failed"
            failed+=("$package")
          fi
          echo "::endgroup::"
        done

        echo "name=${PACKAGES%% *}" >> "$GITHUB_OUTPUT"
        echo "failed=${failed[*]}" >> "$GITHUB_OUTPUT"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: hashFiles('out/**') != ''
      with:
        name: build-${{ inputs.platform }}-${{ steps.build.outputs.name }}
        path: out/
        retention-days: 7
        if-no-files-found: error
    - name: Fail for the packages that didn't build
      if: steps.build.outputs.failed != ''
      shell: bash
      env:
        FAILED: ${{ steps.build.outputs.failed }}
      run: |
        echo "::error::Failed: $FAILED"
        exit 1

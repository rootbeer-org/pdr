name: Prepare package results
description: Identify the build environment and restore verified package results.
inputs:
  revision:
    description: Full Rootbeer engine commit SHA
    required: true
  runner:
    description: Runner image label
    required: true
  recheck:
    description: Start a fresh recheck and recover only results from this run
    default: "false"
outputs:
  cache-key:
    description: Key for saving completed results
    value: ${{ steps.cache.outputs.cache-primary-key }}
  cache-context:
    description: Build environment identity
    value: ${{ steps.environment.outputs.digest }}
runs:
  using: composite
  steps:
    - name: Identify package build environment
      id: environment
      shell: bash
      run: |
        : "${ImageOS:?}" "${ImageVersion:?}" "${RUNNER_ARCH:?}"
        {
          printf '%s\n' "$ImageOS" "$ImageVersion" "$RUNNER_ARCH"
          cc --version
          make --version
        } > "$RUNNER_TEMP/package-environment"
        echo "digest=$(shasum -a 256 "$RUNNER_TEMP/package-environment" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
    - name: Restore verified package results
      id: cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .package-results
        key: results-v4-${{ inputs.runner }}-${{ steps.environment.outputs.digest }}-${{ inputs.revision }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          results-v4-${{ inputs.runner }}-${{ steps.environment.outputs.digest }}-${{ inputs.revision }}-
          results-v4-${{ inputs.runner }}-${{ steps.environment.outputs.digest }}-
    - uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
      if: inputs.recheck != 'true' && vars.DURABLE_PACKAGE_RESULTS == 'true'
      with:
        version: 1.3.0
    - name: Import approved durable qualifications
      if: inputs.recheck != 'true' && vars.DURABLE_PACKAGE_RESULTS == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        printf '%s' "$GH_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        python3 .github/scripts/candidate-store.py seed
    - name: Recover completed work from an earlier attempt
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        SHOULD_RECHECK: ${{ inputs.recheck }}
        RESULT_RUNNER: ${{ inputs.runner }}
        RESULT_CONTEXT: ${{ steps.environment.outputs.digest }}
        ENGINE_REVISION: ${{ inputs.revision }}
      run: |
        options=()
        if [ "$SHOULD_RECHECK" = true ]; then options+=(--recheck); fi
        python3 .github/scripts/package-results.py restore \
          --runner "$RESULT_RUNNER" --context "$RESULT_CONTEXT" --engine-revision "$ENGINE_REVISION" "${options[@]}"

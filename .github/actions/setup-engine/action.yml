name: Set up package engine
description: Download and verify the Forge binary for the pinned engine commit.
inputs:
  runner:
    description: Runner image label used by the job
    required: true
  revision-file:
    description: File containing the approved engine commit for this publication flow
    default: package-engine-revision
outputs:
  revision:
    description: Full Rootbeer commit SHA
    value: ${{ steps.install.outputs.revision }}
runs:
  using: composite
  steps:
    - name: Install attested Forge binary
      id: install
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        ENGINE_RUNNER: ${{ inputs.runner }}
        ENGINE_REVISION_FILE: ${{ inputs.revision-file }}
      run: |
        revision=$(cat "$ENGINE_REVISION_FILE")
        if ! [[ "$revision" =~ ^[0-9a-f]{40}$ ]]; then
          echo 'Engine revision must be a full lowercase commit SHA.' >&2
          exit 1
        fi
        case "$ENGINE_RUNNER" in
          ubuntu-24.04) target=x86_64-unknown-linux-gnu ;;
          ubuntu-24.04-arm) target=aarch64-unknown-linux-gnu ;;
          macos-15) target=aarch64-apple-darwin ;;
          *) echo "Unsupported Forge runner: $ENGINE_RUNNER" >&2; exit 1 ;;
        esac
        directory=$(mktemp -d)
        trap 'rm -rf "$directory"' EXIT
        binary="$directory/rootbeer-forge-$target"
        gh release download "forge-$revision" --repo rootbeer-org/rootbeer \
          --pattern "rootbeer-forge-$target" --dir "$directory"
        gh attestation verify "$binary" --repo rootbeer-org/rootbeer \
          --signer-workflow rootbeer-org/rootbeer/.github/workflows/build.yml \
          --source-ref refs/heads/main --source-digest "$revision" --deny-self-hosted-runners
        mkdir -p engine-bin
        install -m 0755 "$binary" engine-bin/rootbeer-forge
        engine-bin/rootbeer-forge --help >/dev/null
        printf 'revision=%s\n' "$revision" >> "$GITHUB_OUTPUT"

name: Package index
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-engine
        with:
          revision: ${{ vars.ROOTBEER_REV }}
          runner: ubuntu-24.04-arm
      - name: Build LZ4 and retain test output
        shell: bash
        run: |
          status=0
          engine/target/release/rb package --catalog packages build lz4 --output diagnostic --jobs 2 || status=$?
          python3 - <<'PY'
          from pathlib import Path
          path = Path('diagnostic/build.log')
          if path.exists():
              print('\n'.join(path.read_text(errors='replace').splitlines()[-120:]))
          PY
          exit "$status"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: lz4-arm64-build-log
          path: diagnostic/build.log
          if-no-files-found: error

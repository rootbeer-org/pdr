name: Package index
on:
  pull_request:
    branches: [main]
    paths: ["engine-revision", "packages/**", ".github/workflows/packages.yml", ".github/actions/**", ".github/scripts/**", "tests/**"]
  workflow_dispatch:
    inputs:
      recheck:
        description: Rebuild and recheck every package
        type: boolean
        default: false
  workflow_call:
    inputs:
      recheck:
        description: Rebuild and recheck every package
        type: boolean
        default: false
      catalog:
        description: Directory containing the recipes to verify
        type: string
        default: packages
      candidates:
        description: Artifact holding candidate recipes to download before verifying
        type: string
        default: ""
      retention-days:
        description: How long to retain the verified bundle and engine
        type: number
        default: 14

permissions:
  contents: read

concurrency:
  group: index-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.event.repository.private != true
    permissions:
      contents: read
      actions: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ inputs.recheck && 170 || 75 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/setup-engine
        id: engine
        with:
          runner: ${{ matrix.runner }}
      - name: Test result handoff
        env:
          ROOTBEER_FORGE: engine/target/release/rootbeer-forge
        run: python3 tests/package-results_test.py
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: inputs.candidates != ''
        with:
          name: ${{ inputs.candidates }}
          path: candidates
      - uses: ./.github/actions/prepare-package-results
        id: results
        with:
          revision: ${{ steps.engine.outputs.revision }}
          recheck: ${{ inputs.recheck }}
          runner: ${{ matrix.runner }}
      - uses: ./.github/actions/export-packages
        timeout-minutes: ${{ inputs.recheck && 150 || 55 }}
        with:
          cache-context: ${{ steps.results.outputs.cache-context }}
          recheck: ${{ inputs.recheck }}
          catalog: ${{ inputs.catalog || 'packages' }}
      - name: Checkpoint completed package results
        if: ${{ !cancelled() && steps.results.outcome == 'success' }}
        id: checkpoint
        env:
          SHOULD_RECHECK: ${{ inputs.recheck }}
          RESULT_RUNNER: ${{ matrix.runner }}
          RESULT_CONTEXT: ${{ steps.results.outputs.cache-context }}
          ENGINE_REVISION: ${{ steps.engine.outputs.revision }}
        run: |
          options=()
          if [ "$SHOULD_RECHECK" = true ]; then options+=(--recheck); fi
          python3 .github/scripts/package-results.py save \
            --runner "$RESULT_RUNNER" --context "$RESULT_CONTEXT" --engine-revision "$ENGINE_REVISION" "${options[@]}"
      - name: Retain completed work independently of job success
        if: ${{ !cancelled() && steps.checkpoint.outputs.has-results == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-results-${{ matrix.runner }}-${{ github.run_attempt }}
          path: package-checkpoint/package-results.tar
          retention-days: ${{ inputs.retention-days || 14 }}
          compression-level: 0
          if-no-files-found: error
      - name: Retain package work plan
        if: ${{ !cancelled() && hashFiles('package-plan.json') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-plan-${{ matrix.runner }}-${{ github.run_attempt }}
          path: package-plan.json
          retention-days: ${{ inputs.retention-days || 14 }}
      - name: Discard reconstructed build store
        if: ${{ !cancelled() }}
        shell: bash
        run: rm -rf .package-results/builds/store
      - name: Save verified package results
        if: ${{ !cancelled() && (github.ref == 'refs/heads/main' || github.event_name == 'pull_request') && steps.results.outputs.cache-key != '' && hashFiles('.package-results/**/record.json', '.package-results/builds/results/**/receipt.json') != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .package-results
          key: ${{ steps.results.outputs.cache-key }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: engine-${{ matrix.runner }}
          overwrite: true
          path: engine/target/release/rootbeer-forge
          retention-days: ${{ inputs.retention-days || 14 }}
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages-${{ matrix.runner }}
          overwrite: true
          path: result/
          retention-days: ${{ inputs.retention-days || 14 }}
          if-no-files-found: error

  assemble:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: engine-ubuntu-24.04
          path: engine-bin
      - run: chmod +x engine-bin/rootbeer-forge
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: packages-*
          path: inputs
      - name: Require complete version and platform coverage
        run: engine-bin/rootbeer-forge assemble --inputs inputs --output bundle
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-bundle
          overwrite: true
          path: bundle/
          retention-days: ${{ inputs.retention-days || 14 }}
          if-no-files-found: error

name: Package index
on:
  pull_request:
    branches: [main]
    paths: ["engine-revision", "packages/**", ".github/workflows/packages.yml", ".github/actions/**"]
  workflow_dispatch:
    inputs:
      recheck:
        description: Rebuild and recheck every package
        type: boolean
        default: false
  workflow_call:
    inputs:
      recheck:
        description: Rebuild and recheck every package
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: index-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.event.repository.private == false
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-engine
        id: engine
        with:
          runner: ${{ matrix.runner }}
      - uses: ./.github/actions/export-packages
        with:
          revision: ${{ steps.engine.outputs.revision }}
          runner: ${{ matrix.runner }}
          recheck: ${{ github.event_name == 'schedule' || inputs.recheck == true }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: engine-${{ matrix.runner }}
          path: engine/target/release/rootbeer-forge
          retention-days: 2
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages-${{ matrix.runner }}
          path: result/
          retention-days: 2
          if-no-files-found: error

  assemble:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: engine-ubuntu-24.04
          path: engine-bin
      - run: chmod +x engine-bin/rootbeer-forge
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: packages-*
          path: inputs
      - name: Require complete version and platform coverage
        run: engine-bin/rootbeer-forge assemble --inputs inputs --output bundle
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-bundle
          path: bundle/
          retention-days: 2
          if-no-files-found: error

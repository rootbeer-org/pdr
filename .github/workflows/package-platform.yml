name: Plan platform packages
on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
      packages:
        required: true
        type: string
      reuse-run:
        type: string
        default: ""

permissions:
  contents: read

jobs:
  plan:
    name: Find missing signed results
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has-work: ${{ steps.plan.outputs.has-work }}
      context: ${{ steps.tools.outputs.context }}
    steps:
      - name: Read approved recipes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-engine
        with:
          runner: ${{ inputs.runner }}
          revision-file: package-engine-revision
      - uses: ./.github/actions/setup-package-tools
        id: tools
      - name: Install registry client
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d
        with:
          version: 1.3.0
      - name: Plan individual package builds
        id: plan
        env:
          PACKAGES: ${{ inputs.packages }}
          BUILD_CONTEXT: ${{ steps.tools.outputs.context }}
          PACKAGE_REGISTRY: ${{ github.repository }}
          PACKAGE_PUBLIC_KEY: ${{ vars.INDEX_PUBLIC_KEY }}
          GH_TOKEN: ${{ github.token }}
          REUSE_RUN: ${{ inputs.reuse-run }}
          PACKAGE_RUNNER: ${{ inputs.runner }}
          RECORD_DIRECTORY: discovery-records
        run: python3 .github/scripts/package-jobs.py
      - name: Retain reused package records for discovery
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: published-records-plan-${{ inputs.runner }}-${{ github.run_attempt }}
          path: discovery-records/*.json
          if-no-files-found: ignore

  package:
    name: ${{ matrix.package }} (${{ matrix.system }})
    needs: plan
    if: needs.plan.outputs.has-work == 'true'
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    uses: ./.github/workflows/package-job.yml
    secrets: inherit
    permissions:
      contents: read
      actions: read
      packages: write
    with:
      runner: ${{ inputs.runner }}
      package: ${{ matrix.package }}
      name: ${{ matrix.name }}
      key: ${{ matrix.key }}
      context: ${{ needs.plan.outputs.context }}
      artifact: ${{ matrix.artifact || '' }}
      reuse-run: ${{ inputs.reuse-run }}

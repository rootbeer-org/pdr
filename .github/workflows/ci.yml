name: Packages
# PRs build and check the keys they change. Main publishes to the store, and its
# schedule builds whatever the store still lacks. Each build is staged once it
# passes, so a rerun or a later run resumes from there, and main promotes what a
# PR built instead of building it again.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: rb-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  REGISTRY: https://ghcr.io
  STORE: rootbeer-org/store
  STAGING: rootbeer-org/staging
  # A same-repository PR can already change this workflow and write the store,
  # so staging its builds trusts no one new. A fork's token can't.
  CAN_STAGE: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          # A PR checks out its merge commit, whose first parent is main
          fetch-depth: 2
      - uses: rootbeer-org/setup-rb@bf50460fdf9e1b17508117150b26b624b840d08c

      # A PR builds only the keys it changes, and whatever of theirs the store
      # and staging lack. The rest is main's to build.
      - name: List the keys this PR changes
        if: github.event_name == 'pull_request'
        run: |
          git worktree add --detach "$RUNNER_TEMP/base" HEAD^1
          if ! rb drv keys --catalog "$RUNNER_TEMP/base/packages" --host "$RUNNER_TEMP/base/host.lua" \
            | jq --raw-output .key > "$RUNNER_TEMP/base.keys"; then
            echo "::warning::main doesn't evaluate, so every key counts as changed"
            : > "$RUNNER_TEMP/base.keys"
          fi

          rb drv keys | jq --raw-output '"\(.key) \(.platform) \(.name)@\(.version)"' \
            | awk 'NR == FNR { base[$1]; next } !($1 in base) { print $2, $3 }' "$RUNNER_TEMP/base.keys" - \
            > "$RUNNER_TEMP/changed"
          cat "$RUNNER_TEMP/changed"

      - name: Plan what's missing
        id: plan
        env:
          RB_REGISTRY_USER: ${{ github.actor }}
          RB_REGISTRY_TOKEN: ${{ github.token }}
        run: |
          # A PR resumes from what its earlier runs staged. Main counts only the
          # store, and its build installs whatever staging already has.
          from=(--from "$STORE")
          if [[ $GITHUB_EVENT_NAME == pull_request && $CAN_STAGE == true ]]; then
            from+=(--from "$STAGING")
          fi

          matrix='[]'
          for entry in x86_64-linux:ubuntu-24.04 aarch64-linux:ubuntu-24.04-arm aarch64-macos:macos-15; do
            platform=${entry%%:*}
            runner=${entry#*:}

            # Naming no packages plans every one, which a PR that changes none mustn't
            packages=()
            if [[ $GITHUB_EVENT_NAME == pull_request ]]; then
              mapfile -t packages < <(awk -v platform="$platform" '$1 == platform { print $2 }' "$RUNNER_TEMP/changed")
              if (( ${#packages[@]} == 0 )); then
                continue
              fi
            fi

            # Levels in order put each package after everything it depends on
            plan=$(rb drv plan "${packages[@]}" --platform "$platform" --registry "$REGISTRY" "${from[@]}")
            ordered=$(jq --raw-output '.levels | flatten | join(" ")' <<< "$plan")
            if [[ -z $ordered ]]; then
              continue
            fi

            matrix=$(jq --compact-output --arg platform "$platform" --arg runner "$runner" --arg packages "$ordered" \
              '. + [{$platform, $runner, $packages}]' <<< "$matrix")
          done

          jq . <<< "$matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  builder:
    name: Builder (${{ matrix.runner }})
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Publish the builder image unless ghcr has it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<< "$GH_TOKEN"
          hash=$(sha256sum < .github/builder/Dockerfile)
          image="ghcr.io/rootbeer-org/builder:${hash%% *}-$(uname -m)"
          if docker manifest inspect "$image" > /dev/null 2>&1; then
            echo "$image is already published"
            exit 0
          fi
          docker build --tag "$image" .github/builder
          docker push "$image"

  # One job per platform builds its whole plan in order, which keeps macOS to a
  # single runner per run.
  build:
    name: Build (${{ matrix.platform }})
    needs: [plan, builder]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.matrix != '[]' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: rootbeer-org/setup-rb@bf50460fdf9e1b17508117150b26b624b840d08c
      - name: Prepare the store
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ $RUNNER_OS == Linux ]]; then
            docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<< "$GH_TOKEN"
            # bubblewrap in the builder is unprivileged as far as the host knows
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
            echo "RB=$GITHUB_WORKSPACE/.github/builder/rb" >> "$GITHUB_ENV"
          else
            # The toolchain host.lua names for aarch64-macos, which every macOS key includes
            sudo xcode-select --switch /Applications/Xcode_16.4.app
            sudo "$(command -v rb-helper)" setup admin
            echo 'RB=rb' >> "$GITHUB_ENV"
          fi

      - name: Build, check, and stage
        env:
          PACKAGES: ${{ matrix.packages }}
          RB_REGISTRY_USER: ${{ github.actor }}
          RB_REGISTRY_TOKEN: ${{ github.token }}
        run: |
          # A package whose dependency failed fails fast instead of building it.
          # rerun.yml retries a failed run only when no package failed.
          from=(--from "$STORE")
          if [[ $CAN_STAGE == true ]]; then
            from+=(--from "$STAGING")
          fi

          failed=()
          for package in $PACKAGES; do
            echo "::group::$package"
            exported=$(ls out 2> /dev/null || true)
            if ! "$RB" drv build "$package" --verbose --require-dependencies \
              --registry "$REGISTRY" "${from[@]}" \
              || ! "$RB" drv export "$package" out; then
              echo "::endgroup::"
              echo "::error title=Package failed::$package"
              failed+=("$package")
              continue
            fi

            # Only what this export added, since everything before it is staged
            rm -rf stage
            mkdir stage
            comm -13 <(echo "$exported") <(ls out) | xargs -I {} ln -s ../out/{} stage/{}
            if [[ $CAN_STAGE == true && -n $(ls stage) ]]; then
              # A rerun rebuilds what failed to stage, so this build goes on
              "$RB" drv publish stage --registry "$REGISTRY" --namespace "$STAGING" \
                || echo "::warning::$package wasn't staged"
            fi
            echo "::endgroup::"
          done

          (( ${#failed[@]} == 0 ))

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && hashFiles('out/**') != '' }}
        with:
          name: build-${{ matrix.platform }}
          path: out/
          retention-days: 7
          if-no-files-found: error
          # A rerun exports everything again, including what it installed from staging
          overwrite: true

  # The one check the default branch's ruleset requires
  checks:
    name: Package checks
    needs: [plan, build]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require the plan and every planned build
        env:
          PLAN: ${{ needs.plan.result }}
          BUILD: ${{ needs.build.result }}
          MATRIX: ${{ needs.plan.outputs.matrix }}
        run: |
          echo "plan $PLAN, build $BUILD"
          [[ $PLAN == success ]]

          # Only a plan with nothing to build may skip the build
          if [[ $MATRIX == '[]' ]]; then
            [[ $BUILD == skipped ]]
          else
            [[ $BUILD == success ]]
          fi

  # The workflow token can write the store from any branch's workflow, so the
  # store is only as safe as push access to this repository. Whatever built is
  # published, and a failed package holds back only what depends on it.
  publish:
    name: Publish
    needs: [plan, build]
    if: ${{ !cancelled() && needs.plan.result == 'success' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: rootbeer-org/setup-rb@bf50460fdf9e1b17508117150b26b624b840d08c
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: build-*
          path: outputs
          merge-multiple: true
      - name: Publish this run's outputs to the store
        env:
          RB_REGISTRY_USER: ${{ github.actor }}
          RB_REGISTRY_TOKEN: ${{ github.token }}
        run: |
          if [[ ! -d outputs ]]; then
            echo 'Nothing was built, so nothing is published.'
            exit 0
          fi
          rb drv publish outputs --registry "$REGISTRY" --namespace "$STORE"

  # The index repository holds the online key and signs, so the key never
  # reaches a repository that runs package builds. A push can change a recipe's
  # metadata, such as how its apps update, without building anything, so every
  # run of main indexes. A scheduled run that queues behind a running one
  # cancels a pending push, and then it has to index that push's changes.
  index:
    name: Index
    needs: publish
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: rootbeer-org/setup-rb@bf50460fdf9e1b17508117150b26b624b840d08c
      - name: Write an index entry for each published package
        run: rb drv index "$RUNNER_TEMP/entries" --registry "$REGISTRY" --namespace "$STORE"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rb-index-entries
          path: ${{ runner.temp }}/entries
          retention-days: 7
          if-no-files-found: error
      - name: Mint a token to dispatch the index's signing
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.ROOTBEER_BOT_CLIENT_ID }}
          private-key: ${{ secrets.ROOTBEER_BOT_PRIVATE_KEY }}
          owner: rootbeer-org
          repositories: index
          permission-actions: write
      - name: Ask the index repository to sign them
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: gh workflow run sign.yml --repo rootbeer-org/index --field run-id="$GITHUB_RUN_ID"

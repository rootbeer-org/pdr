name: Build and publish one package
on:
  workflow_call:
    inputs:
      runner:
        type: string
        required: true
      package:
        type: string
        required: true
      name:
        type: string
        required: true
      key:
        type: string
        required: true
      context:
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: package-${{ inputs.key }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and check
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      artifact: ${{ steps.retain.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-engine
        with:
          runner: ${{ inputs.runner }}
      - uses: ./.github/actions/setup-package-tools
        id: tools
      - name: Require the planned runner image
        env:
          EXPECTED: ${{ inputs.context }}
          ACTUAL: ${{ steps.tools.outputs.context }}
        run: test "$EXPECTED" = "$ACTUAL"
      - name: Install registry client
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d
        with:
          version: 1.3.0
      - name: Reuse a result published while this job was queued
        id: reuse
        env:
          PACKAGES: ${{ inputs.package }}
          BUILD_CONTEXT: ${{ inputs.context }}
          EXPECTED_KEY: ${{ inputs.key }}
          PACKAGE_REGISTRY: ${{ github.repository }}
          PACKAGE_PUBLIC_KEY: ${{ vars.INDEX_PUBLIC_KEY }}
        run: python3 .github/scripts/package-jobs.py
      - name: Build and check this package
        if: steps.reuse.outputs.has-work == 'true'
        env:
          PACKAGE: ${{ inputs.package }}
          INPUT_KEY: ${{ inputs.key }}
          BUILD_CONTEXT: ${{ inputs.context }}
        run: |
          engine-bin/rootbeer-forge --catalog packages build "$PACKAGE" \
            --input-key "$INPUT_KEY" --output result \
            --cache "$RUNNER_TEMP/package-cache" --cache-context "$BUILD_CONTEXT"
      - name: Retain this verified build
        if: steps.reuse.outputs.has-work == 'true'
        id: retain
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: package-${{ inputs.key }}-${{ github.run_attempt }}
          path: |
            result/package.tar.gz
            result/receipt.json
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Sign and publish
    needs: build
    if: needs.build.outputs.artifact != '' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && vars.PUBLISH_INDEX == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: package-publishing
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - name: Read approved recipe and publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-engine
        with:
          runner: ubuntu-24.04
      - name: Download this job's verified build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.build.outputs.artifact }}
          path: result
          merge-multiple: true
      - name: Install registry client
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d
        with:
          version: 1.3.0
      - name: Approve these exact inputs and sign this package
        env:
          PACKAGE_NAME: ${{ inputs.name }}
          INPUT_KEY: ${{ inputs.key }}
          PACKAGE_REGISTRY: ${{ github.repository }}/${{ inputs.name }}
          INDEX_SIGNING_KEY: ${{ secrets.INDEX_SIGNING_KEY }}
          INDEX_PUBLIC_KEY: ${{ vars.INDEX_PUBLIC_KEY }}
        run: |
          umask 077
          key="$RUNNER_TEMP/package-key.der"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$INDEX_SIGNING_KEY" | base64 --decode > "$key"
          unset INDEX_SIGNING_KEY
          engine-bin/rootbeer-forge release --recipe "packages/$PACKAGE_NAME.lua" \
            --receipt result/receipt.json --input-key "$INPUT_KEY" \
            --registry "$PACKAGE_REGISTRY" --output release \
            --key "$key" --public-key "$INDEX_PUBLIC_KEY"
      - name: Store package and signed record in GHCR
        env:
          GH_TOKEN: ${{ github.token }}
          INDEX_PUBLIC_KEY: ${{ vars.INDEX_PUBLIC_KEY }}
        run: |
          printf '%s' "$GH_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          engine-bin/rootbeer-forge push release --public-key "$INDEX_PUBLIC_KEY" | tee publication.txt
          cat publication.txt >> "$GITHUB_STEP_SUMMARY"

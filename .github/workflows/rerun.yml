name: Rerun lost builds
# A Packages run that failed without a package failing lost a runner, timed
# out, or hit a registry error. What passed is staged, so running its failed
# jobs again resumes from there. A package that failed waits for a fix.
on:
  workflow_run:
    workflows: [Packages]
    types: [completed]

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  rerun:
    name: Rerun
    if: contains(fromJSON('["failure", "timed_out"]'), github.event.workflow_run.conclusion) && github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Mint a token to rerun checks
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.ROOTBEER_BOT_CLIENT_ID }}
          private-key: ${{ secrets.ROOTBEER_BOT_PRIVATE_KEY }}
          owner: rootbeer-org
          repositories: pdr
          permission-actions: write
          permission-checks: read
      - name: Rerun the failed jobs unless a package failed
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          RUN: ${{ github.event.workflow_run.id }}
        run: |
          jobs=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$RUN/jobs?filter=latest" \
            --jq '.jobs[] | select(.conclusion == "failure" or .conclusion == "timed_out") | .id')
          for job in $jobs; do
            titles=$(gh api "repos/$GITHUB_REPOSITORY/check-runs/$job/annotations" --jq '.[].title')
            if grep --quiet --line-regexp 'Package failed' <<< "$titles"; then
              echo "A package failed in job $job, so run $RUN is left as is"
              exit 0
            fi
          done

          gh run rerun "$RUN" --failed --repo "$GITHUB_REPOSITORY"
          echo "reran $RUN"

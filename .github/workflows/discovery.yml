name: Upstream discovery
on:
  push:
    branches: [main]
    paths: ["rootbeer-update", "engine-revision", "packages/**", ".github/workflows/discovery.yml", ".github/actions/**", ".github/scripts/**"]
  workflow_dispatch:
    inputs:
      rootbeer_only:
        description: Only update Rootbeer from successful main CI
        type: boolean
        default: false
  repository_dispatch:
    types: [rootbeer-update]
  schedule:
    - cron: "13 7 * * *"
    - cron: "*/15 * * * *"

permissions:
  contents: read

concurrency:
  group: discovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.report.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check for a new CI-verified Rootbeer commit
        id: rootbeer
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/rootbeer-update.py --probe
      - uses: ./.github/actions/setup-engine
        if: >-
          (github.event_name != 'repository_dispatch' && github.event.head_commit.message != 'ci(rootbeer): request update' && github.event.schedule != '*/15 * * * *' && inputs.rootbeer_only != true) || steps.rootbeer.outputs.changed == 'true'
        id: engine
        with:
          runner: ubuntu-24.04
      - name: Test update automation
        if: steps.engine.outcome == 'success'
        env:
          ROOTBEER_FORGE: engine/target/release/rootbeer-forge
        run: |
          python3 tests/rootbeer-update_test.py
          ruby tests/promote-updates_test.rb
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: >-
          github.event_name != 'repository_dispatch' && github.event.head_commit.message != 'ci(rootbeer): request update' && github.event.schedule != '*/15 * * * *' && inputs.rootbeer_only != true
        with:
          path: .upstream-metadata
          key: upstream-metadata-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: upstream-metadata-v1-
      - name: Prepare Rootbeer-only scan
        if: >-
          github.event_name == 'repository_dispatch' || github.event.head_commit.message == 'ci(rootbeer): request update' || github.event.schedule == '*/15 * * * *' || inputs.rootbeer_only == true
        run: |
          mkdir -p candidates
          printf '%s\n' '{"updated":[],"rules_changed":[],"errors":{},"untracked":[]}' > candidates/report.json
          printf '%s\n' '# Rootbeer update' > candidates/summary.md
      - name: Discover updates
        if: >-
          github.event_name != 'repository_dispatch' && github.event.head_commit.message != 'ci(rootbeer): request update' && github.event.schedule != '*/15 * * * *' && inputs.rootbeer_only != true
        id: discovery
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          engine/target/release/rootbeer-forge --catalog packages updates \
            --cache .upstream-metadata --output candidates
      - name: Discover CI-verified Rootbeer source
        if: steps.rootbeer.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/rootbeer-update.py
      - name: Summarize candidates and exceptions
        id: report
        if: always()
        run: |
          test -f candidates/report.json
          cat candidates/summary.md >> "$GITHUB_STEP_SUMMARY"
          echo "changed=$(jq '(.updated + .rules_changed) | length > 0' candidates/report.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always() && steps.discovery.outcome != 'skipped' && github.ref == 'refs/heads/main'
        with:
          path: .upstream-metadata
          key: upstream-metadata-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: upstream-candidates
          path: candidates/
          retention-days: 14
          if-no-files-found: error
      - name: Surface discovery failures
        if: steps.discovery.outcome == 'failure'
        run: echo "::warning::Some upstreams failed; see the discovery report. Successful candidates continue independently."

  qualify:
    permissions:
      contents: read
      actions: read
      packages: read
    needs: discover
    if: always() && needs.discover.outputs.changed == 'true'
    uses: ./.github/workflows/packages.yml
    with:
      catalog: candidates/packages
      candidates: upstream-candidates
      retention-days: 14

name: Publish packages
on:
  workflow_run:
    workflows: [Upstream discovery]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths: ["engine-revision", "packages/**"]
  workflow_dispatch:
    inputs:
      recheck:
        description: Rebuild and recheck every package
        type: boolean
        default: false
  schedule:
    - cron: "23 6 * * 1"

permissions:
  contents: read

concurrency:
  group: publish-packages
  cancel-in-progress: false

jobs:
  select:
    if: github.ref == 'refs/heads/main' && github.event.repository.private == false && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
      pull-requests: read
    outputs:
      run_id: ${{ steps.promotion.outputs.run_id || steps.bundle.outputs.run_id }}
      revision: ${{ steps.promotion.outputs.revision || steps.current.outputs.revision }}
      ready: ${{ github.event_name != 'workflow_run' || steps.promotion.outputs.ready == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.sha }}
      - name: Record publication revision
        id: current
        run: echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Check for a qualified discovery bundle
        if: github.event_name == 'workflow_run'
        id: discovery
        env:
          GH_TOKEN: ${{ github.token }}
          DISCOVERY_RUN: ${{ github.event.workflow_run.id }}
        run: |
          found=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$DISCOVERY_RUN/artifacts?per_page=100" \
            --jq '[.artifacts[] | select(.name == "verified-bundle" and .expired == false)] | length == 1')
          echo "qualified=$found" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup-engine
        if: steps.discovery.outputs.qualified == 'true'
        with:
          runner: ubuntu-24.04
          cache-scope: publish
      - name: Promote verified discovery candidates
        if: steps.discovery.outputs.qualified == 'true' && vars.PUBLISH_INDEX == 'true'
        id: promotion
        env:
          GH_TOKEN: ${{ github.token }}
          DISCOVERY_RUN: ${{ github.event.workflow_run.id }}
        run: |
          gh auth setup-git
          ruby .github/scripts/promote-updates.rb
      - name: Select an approved verification run
        if: github.event_name != 'workflow_run'
        id: bundle
        env:
          GH_TOKEN: ${{ github.token }}
          RECHECK: ${{ github.event_name == 'schedule' || inputs.recheck == true }}
        run: ruby .github/scripts/verified-bundle.rb select

  verify:
    permissions:
      contents: read
      actions: read
    needs: select
    if: needs.select.outputs.ready == 'true' && needs.select.outputs.run_id == ''
    uses: ./.github/workflows/packages.yml
    with:
      recheck: ${{ github.event_name == 'schedule' || inputs.recheck == true }}

  publish:
    needs: [select, verify]
    if: always() && github.ref == 'refs/heads/main' && needs.select.result == 'success' && needs.select.outputs.ready == 'true' && (needs.verify.result == 'success' || needs.verify.result == 'skipped') && vars.PUBLISH_INDEX == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: package-publishing
    permissions:
      actions: read
      contents: write
      packages: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.select.outputs.revision }}
      - uses: ./.github/actions/setup-engine
        with:
          runner: ubuntu-24.04
          cache-scope: publish
      - name: Download verified bundle by digest
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ needs.select.outputs.run_id || github.run_id }}
        run: ruby .github/scripts/verified-bundle.rb download
      - name: Match bundle to approved recipes
        run: engine/target/release/rootbeer-forge --catalog packages verify-bundle bundle
      - uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
        with:
          version: 1.3.0
      - name: Restore retained Pages history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          git init -b gh-pages site
          git -C site remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          refs=$(git -C site ls-remote --heads origin gh-pages)
          if [ -n "$refs" ]; then
            git -C site fetch --depth=1 origin gh-pages
            git -C site reset --hard FETCH_HEAD
          fi
      - name: Authenticate publisher
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Upload blobs and sign snapshot
        env:
          INDEX_SIGNING_KEY: ${{ secrets.INDEX_SIGNING_KEY }}
          INDEX_PUBLIC_KEY: ${{ vars.INDEX_PUBLIC_KEY }}
          INDEX_URL: ${{ vars.INDEX_URL }}
        run: |
          sequence=$((GITHUB_RUN_ID * 1000 + GITHUB_RUN_ATTEMPT))
          umask 077
          key="$RUNNER_TEMP/index-signing-key.der"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$INDEX_SIGNING_KEY" | base64 --decode > "$key"
          unset INDEX_SIGNING_KEY
          engine/target/release/rootbeer-forge publish --bundle bundle --site site \
            --site-url "$INDEX_URL" --registry tale/rootbeer-index --sequence "$sequence" \
            --repository-url "https://github.com/$GITHUB_REPOSITORY" \
            --key "$key" --public-key "$INDEX_PUBLIC_KEY" --manifest current.json
      - name: Retain immutable snapshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git -C site config user.name 'github-actions[bot]'
          git -C site config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C site add public
          git -C site commit -m "publish package snapshot ${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          git -C site push origin HEAD:gh-pages
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/public
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

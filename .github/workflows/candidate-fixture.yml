name: Candidate retention fixture
on:
  push:
    branches: [refactor/package-ci]
    paths:
      - engine-revision
      - .github/workflows/candidate-fixture.yml
      - .github/scripts/candidate-store.py
      - .github/scripts/retain-results.py
      - tests/candidate-*.py
  workflow_dispatch:
    inputs:
      cache-retry:
        description: Exercise failed package recovery; rerun the expected failed job once
        type: boolean
        default: false
      source-run:
        description: Reuse completed fixture builds from this run and retry retention only
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/refactor/package-ci' && inputs.source-run == '' && inputs.cache-retry != true
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-engine
        with:
          runner: ${{ matrix.runner }}
      - name: Test candidate admission and publication
        env:
          ROOTBEER_FORGE: engine/target/release/rootbeer-forge
        run: |
          python3 tests/candidate-store_test.py
      - name: Build one fixture without registry credentials
        run: python3 tests/candidate-fixture.py prepare --systems x86_64-linux aarch64-linux
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: retention-fixture-${{ matrix.runner }}
          path: fixture/
          overwrite: true
          retention-days: 2
          if-no-files-found: error

  retain:
    needs: build
    if: always() && github.ref == 'refs/heads/refactor/package-ci' && (needs.build.result == 'success' || (needs.build.result == 'skipped' && inputs.source-run != ''))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-engine
        with:
          runner: ubuntu-24.04
      - uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
        with:
          version: 1.3.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source-run || github.run_id }}
          pattern: retention-fixture-*
          path: fixture-inputs
      - name: Assemble both fixture platforms
        run: python3 tests/candidate-fixture.py combine
      - name: Authenticate fixture registry
        run: printf '%s' "$GH_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Retain original fixture evidence
        id: candidate
        run: python3 tests/candidate-fixture.py retain
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}/ci-fixture
          subject-digest: ${{ steps.candidate.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Verify signer, restore exact bytes, and reuse without rebuilding
        env:
          CANDIDATE: ${{ steps.candidate.outputs.reference }}
        run: python3 tests/candidate-fixture.py consume --reference "$CANDIDATE"

  cache-retry:
    if: github.ref == 'refs/heads/refactor/package-ci' && inputs.cache-retry == true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-engine
        with:
          runner: ubuntu-24.04
      - uses: ./.github/actions/prepare-package-results
        id: results
        with:
          runner: fixture-retry
          recheck: "true"
      - name: Test failure and recovery with the actual Forge cache
        env:
          ROOTBEER_FORGE: engine/target/release/rootbeer-forge
          CACHE_CONTEXT: ${{ steps.results.outputs.cache-context }}
        run: python3 tests/cache-fixture.py
      - name: Save completed work even when another package failed
        if: ${{ !cancelled() && steps.results.outcome == 'success' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .package-results
          key: ${{ steps.results.outputs.cache-key }}

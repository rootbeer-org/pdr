name: Candidate retention fixture
on:
  push:
    branches: [refactor/package-ci]
    paths:
      - engine-revision
      - .github/workflows/candidate-fixture.yml
      - .github/scripts/candidate-store.py
      - .github/scripts/retain-results.py
      - tests/candidate-*.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixture:
    if: github.ref == 'refs/heads/refactor/package-ci'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-engine
        with:
          runner: ubuntu-24.04
      - uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
        with:
          version: 1.3.0
      - name: Test admission and existing handoff
        env:
          ROOTBEER_FORGE: engine/target/release/rootbeer-forge
        run: |
          python3 tests/candidate-store_test.py
          python3 tests/package-results_test.py
          ruby tests/promote-updates_test.rb
      - name: Authenticate fixture registry
        run: printf '%s' "$GH_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Build one fixture and retain its original evidence
        id: candidate
        run: python3 tests/candidate-fixture.py produce
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}/ci-fixture
          subject-digest: ${{ steps.candidate.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Verify signer, restore exact bytes, and reuse without rebuilding
        env:
          CANDIDATE: ${{ steps.candidate.outputs.reference }}
        run: python3 tests/candidate-fixture.py consume --reference "$CANDIDATE"

name: Packages
run-name: ${{ github.event.pull_request.title || inputs.packages || 'Package updates' }}
on:
  pull_request:
    branches: [main]
    paths: ["packages/**"]
  push:
    branches: [main]
    paths: ["packages/**"]
  workflow_call:
  workflow_dispatch:
    inputs:
      packages:
        description: Exact name@version selections; empty refreshes discovery only
        type: string
        default: ""
      reuse-run:
        description: Recover successful package builds from this approved run
        type: string
        default: ""

permissions:
  contents: read

jobs:
  select:
    name: Select changed packages
    if: github.event_name != 'workflow_run' || github.event.workflow_run.event == 'pull_request' || github.event.workflow_run.head_branch != 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      packages: ${{ steps.select.outputs.packages }}
      reuse-run: ${{ steps.producer.outputs.reuse-run }}
      waiting: ${{ steps.producer.outputs.waiting }}
    steps:
      - name: Read recipes and history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Find completed PR verification
        id: producer
        env:
          GH_TOKEN: ${{ github.token }}
          REUSE_RUN: ${{ inputs.reuse-run }}
        run: python3 .github/scripts/package-producer.py
      - name: Install approved package engine
        if: steps.producer.outputs.waiting != 'true'
        uses: ./.github/actions/setup-engine
        with:
          runner: ubuntu-24.04
          revision-file: package-engine-revision
      - name: Compare expanded package inputs
        if: steps.producer.outputs.waiting != 'true'
        id: select
        env:
          PACKAGES: ${{ inputs.packages }}
          BASE_REVISION: ${{ steps.producer.outputs.base || github.event.pull_request.base.sha || github.event.before }}
        run: python3 .github/scripts/package-selection.py

  platform:
    needs: select
    if: needs.select.outputs.packages != '' && needs.select.outputs.waiting != 'true'
    name: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    uses: ./.github/workflows/package-platform.yml
    permissions:
      contents: read
      actions: read
      packages: write
    with:
      runner: ${{ matrix.runner }}
      packages: ${{ needs.select.outputs.packages }}
      reuse-run: ${{ needs.select.outputs.reuse-run }}
      publish: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

  discovery:
    name: Publish package discovery
    needs: [select, platform]
    if: always() && !cancelled() && needs.select.result == 'success' && needs.select.outputs.waiting != 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.PUBLISH_INDEX == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: package-publishing
    permissions:
      contents: write
      actions: read
    steps:
      - name: Read current approved recipes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - uses: ./.github/actions/setup-engine
        with:
          runner: ubuntu-24.04
          revision-file: package-engine-revision
      - name: Collect successful package records
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: published-records-*
          path: discovery-records
          merge-multiple: true
      - name: Restore published metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          git clone --depth=1 --branch gh-pages "https://github.com/$GITHUB_REPOSITORY.git" site
          mkdir -p discovery-records
          git -C site config user.name 'github-actions[bot]'
          git -C site config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Merge signed records into discovery
        env:
          GH_TOKEN: ${{ github.token }}
          INDEX_SIGNING_KEY: ${{ secrets.INDEX_SIGNING_KEY }}
          INDEX_PUBLIC_KEY: ${{ vars.INDEX_PUBLIC_KEY }}
          INDEX_URL: ${{ vars.INDEX_URL }}
        run: |
          : "${INDEX_SIGNING_KEY:?The publication environment did not provide its signing key}"
          umask 077
          key="$RUNNER_TEMP/discovery-key.der"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$INDEX_SIGNING_KEY" | base64 --decode > "$key"
          unset INDEX_SIGNING_KEY
          for attempt in 1 2 3 4 5; do
            git -C site fetch --depth=1 origin gh-pages
            git -C site reset --hard FETCH_HEAD
            engine-bin/rootbeer-forge --catalog packages publish-records \
              --records discovery-records --site site/public --site-url "$INDEX_URL" \
              --key "$key" --public-key "$INDEX_PUBLIC_KEY"
            test "$(git rev-parse HEAD)" = "$(git ls-remote origin refs/heads/main | cut -f1)"
            git -C site add public
            git -C site commit -m "publish package discovery $GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT"
            if git -C site push origin HEAD:gh-pages; then exit 0; fi
            echo "Retrying discovery merge ($attempt/5)" >&2
          done
          echo 'Discovery changed concurrently; retry this metadata job.' >&2
          exit 1

  deploy:
    name: Deploy latest discovery
    needs: discovery
    if: always() && needs.discovery.result == 'success'
    concurrency:
      group: package-discovery-pages
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment: github-pages
    steps:
      - name: Read all committed package updates
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: gh-pages
          path: site
          persist-credentials: false
      - name: Upload discovery site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: site/public
      - name: Deploy discovery site
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
